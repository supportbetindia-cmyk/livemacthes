# Nginx reverse proxy: your domain -> Next.js on 127.0.0.1:3000
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/livescore
#   (edit server_name below first)
#   sudo ln -s /etc/nginx/sites-available/livescore /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot to add HTTPS automatically:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;  # <-- change to your domain

    # Let Next serve its own static assets efficiently through the proxy.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
